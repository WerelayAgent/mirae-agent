  <style>

    main { padding: 3rem 0; }
    h1 { font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 1rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-top: 1.5rem; }
